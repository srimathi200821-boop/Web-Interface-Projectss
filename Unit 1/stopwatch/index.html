<!DOCTYPE html>
<html lang="en">
<head>
<title>Document</title>
</head>
<body>
<div id="watch">
<h2>Stopwatch</h2>
<h3 id="display">00:00:00</h3>
<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="reset()">Reset</button>
<button onclick="lap()">Laps</button>
<h3>Lap Times</h3>
<div id="laps"></div>
</div>

<style>
body{
margin:0px;
background-image: url(watch.png);
text-align:center;
align-items:center;
justify-content: center;
height:100vh;
display:flex;
}

#watch{
background-color: white;
color:black;
font-size: 25px;
width:350px;
min-height:300px;
padding:20px;
border-radius: 30px;
text-align:center;
letter-spacing: 1px;
margin:0px;
}

button{
background-color: blueviolet;
color: white;
padding: 15px;
margin: 5px;
border:black;
border-radius: 8px;
font-size: 16px;
cursor: pointer;
}

button:hover{
background-color:lightgreen;
}

#laps{
margin-top:20px;
border:1px solid #ccc;
border-radius:10px;
padding:10px;
}
</style>

<script>
let seconds=0;
let minutes=0;
let hours=0;
let timer;

function start(){
if(timer){
return;
}

timer=setInterval(function(){
seconds++;

if(seconds==60){
seconds=0;
minutes++;
}

if(minutes==60){
minutes=0;
hours++;
}

let h = hours < 10 ? "0" + hours : hours;
let m = minutes < 10 ? "0" + minutes : minutes;
let s = seconds < 10 ? "0" + seconds : seconds;

document.getElementById("display").innerHTML = 
h + ":" + m + ":" + s;

},1000)
}

function stop(){
clearInterval(timer);
timer=null;
}

function reset(){
clearInterval(timer);
timer=null;
seconds = 0;
minutes = 0;
hours = 0;
document.getElementById("display").innerHTML = "00:00:00";
}

function lap(){
let time = document.getElementById("display").innerHTML;
document.getElementById("laps").innerHTML += 
"<p>Lap: " + time + "</p>";
}
</script>
</body>
</html>
