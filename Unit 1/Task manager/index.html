<!DOCTYPE html>
<html>
<head>
<title>Colorful Task Manager</title>
<style>
*{
box-sizing:border-box;
}
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#667eea,#764ba2);
padding:20px;
min-height:100vh;
}
h1{
color:white;
font-size:40px;
}
input{
width:300px;
padding:12px;
border:none;
border-radius:20px;
outline:none;
font-size:16px;
}
button{
padding:10px 18px;
border:none;
border-radius:20px;
cursor:pointer;
color:white;
background:#333;
transition:.3s;
}
button:hover{
transform:scale(1.05);
background:black;
}
.container{
display:flex;
justify-content:space-around;
gap:20px;
margin-top:20px;
}
.column{
width:30%;
min-height:300px;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0px 8px 20px rgba(0,0,0,0.2);
}
.column h2{
text-align:center;
color:white;
padding:10px;
border-radius:15px;
}
.column:nth-child(1) h2{
background:#ff9800;
}
.column:nth-child(2) h2{
background:#2196f3;
}
.column:nth-child(3) h2{
background:#4caf50;
}
.task{
background:#f5f5f5;
padding:15px;
margin:15px 0;
border-radius:15px;
box-shadow:0px 4px 10px gray;
}
.task button{
margin:5px;
font-size:12px;
}
.task button:nth-child(1){
background:#2196f3;
}
.task button:nth-child(2){
background:#4caf50;
}
.task button:nth-child(3){
background:#f44336;
}
.graph{
background:white;
padding:20px;
border-radius:20px;
margin-top:30px;
box-shadow:0px 5px 15px gray;
}
.progress{
width:250px;
height:25px;
}
#pendingBar{
accent-color:orange;
}
#progressBar{
accent-color:#2196f3;
}
#doneBar{
accent-color:green;
}
#history{
background:white;
padding:20px;
border-radius:20px;
}
hr{
border:none;
height:2px;
background:white;
margin:30px 0;
}
</style>
</head>
<body>

<h1 align="center"> Task Manager</h1>

<center>
<input type="text" id="task" placeholder="Enter your task">
<button onclick="addTask()"> Add Task</button>
</center>

<div class="graph">
<h2> Task Progress</h2>

Pending :
<progress id="pendingBar" class="progress" value="0" max="10"></progress>
<span id="pendingCount">0</span>

<br><br>

In Progress :
<progress id="progressBar" class="progress" value="0" max="10"></progress>
<span id="progressCount">0</span>

<br><br>

Done :
<progress id="doneBar" class="progress" value="0" max="10"></progress>
<span id="doneCount">0</span>

</div>

<div class="container">

<div class="column">
<h2> Pending</h2>
<div id="pending"></div>
</div>

<div class="column">
<h2> In Progress</h2>
<div id="progress"></div>
</div>

<div class="column">
<h2> Done</h2>
<div id="done"></div>
</div>

</div>

<hr>

<h2 style="color:white"> Activity History</h2>
<ul id="history"></ul>

<script>
let pending=0;
let progress=0;
let done=0;

function addTask(){
let text=document.getElementById("task").value;

if(text==""){
alert("Enter Task");
return;
}

let div=document.createElement("div");
div.className="task";
div.innerHTML=text+"<br><br>";

let btn1=document.createElement("button");
btn1.innerHTML="Progress";

let btn2=document.createElement("button");
btn2.innerHTML="Done";

let btn3=document.createElement("button");
btn3.innerHTML="Delete";

div.appendChild(btn1);
div.appendChild(btn2);
div.appendChild(btn3);

document.getElementById("pending").appendChild(div);

pending++;

addHistory("Task Added : "+text);
updateGraph();

btn1.onclick=function(){
if(div.parentElement.id=="pending"){
pending--;
progress++;
document.getElementById("progress").appendChild(div);
addHistory(text+" moved to Progress");
}

updateGraph();
}

btn2.onclick=function(){
if(div.parentElement.id=="pending"){
pending--;
done++;
}

else if(div.parentElement.id=="progress"){
progress--;
done++;
}

document.getElementById("done").appendChild(div);
addHistory(text+" completed");
updateGraph();
}

btn3.onclick=function(){
if(div.parentElement.id=="pending")
pending--;
else if(div.parentElement.id=="progress")
progress--;
else
done--;

div.remove();

addHistory(text+" deleted");
updateGraph();
}

document.getElementById("task").value="";
}

function addHistory(msg){
let li=document.createElement("li");
let time=new Date().toLocaleTimeString();
li.innerHTML=time+" - "+msg;
document.getElementById("history").prepend(li);
}

function updateGraph(){
document.getElementById("pendingBar").value=pending;
document.getElementById("progressBar").value=progress;
document.getElementById("doneBar").value=done;

document.getElementById("pendingCount").innerHTML=pending;
document.getElementById("progressCount").innerHTML=progress;
document.getElementById("doneCount").innerHTML=done;
}
</script>

</body>
</html>
